name: Genera PDF

on:
  push:
    branches: [ main ]
    paths:
      - 'slide/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: generate pdf
      run: |
        cd slide
        docker run --rm --init -v $PWD:/home/marp/app/ -e LANG="it_IT.UTF-8" -e MARP_USER="$(id -u):$(id -g)" marpteam/marp-cli:v4.5.0 Corso_ScritturaComica.md --pdf --allow-local-files --html

    - name: commit & push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        if git diff --cached --quiet; then
          echo "Nessuna modifica da committare"
        else
          git commit -m "update slides"
          git push
        fi
